<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта в голове — курс по географии</title>
<meta name="description" content="Интерактивный курс по географии: материки, страны, столицы, флаги, ресурсы и регионы мира.">
<meta name="theme-color" content="#DDE9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1E24" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Карта">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#DDE9E7; --bg2:#E9F1EF; --ocean:#BBD5D5; --grat:#AACACA; --land:#F0E8D2; --border:#A7A189; --known:#CFE1C3;
  --ink:#12303A; --muted:#506B73; --line:#B9CFCE; --soft:#CDDEDC;
  --pin:#B0246A; --ok:#2F7D4E; --bad:#B0246A; --on:#FFFFFF;
  --btn:#12303A; --btn-ink:#F2F6F4;
  --a1:#1F6F78; --a2:#3E7A57; --a3:#A0690A; --a4:#5E4B9C; --a5:#3A5FA0; --a6:#5B6B2E;
  --acc:var(--a2);
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,sans-serif;
  --shadow:0 18px 40px -18px rgba(18,48,58,.45);
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme:dark;
    --bg:#0C1E24; --bg2:#10262D; --ocean:#11303A; --grat:#18404A; --land:#36473E; --border:#5C7266; --known:#41634C;
    --ink:#E2ECE9; --muted:#9FB5B4; --line:#22454E; --soft:#163740;
    --pin:#F070A8; --ok:#6DBB8A; --bad:#F070A8; --on:#0C1E24;
    --btn:#E2ECE9; --btn-ink:#0C1E24;
    --a1:#5FB7BF; --a2:#6DBB8A; --a3:#E2AE4A; --a4:#A795E6; --a5:#7FA3E0; --a6:#AFC06A;
    --shadow:0 18px 40px -16px rgba(0,0,0,.7);
  }
}
body[data-acc="1"]{--acc:var(--a1)} body[data-acc="2"]{--acc:var(--a2)} body[data-acc="3"]{--acc:var(--a3)}
body[data-acc="4"]{--acc:var(--a4)} body[data-acc="5"]{--acc:var(--a5)} body[data-acc="6"]{--acc:var(--a6)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(360px,1fr);min-height:100vh}
.mapcol{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}
.panel{padding:26px 40px 90px;max-width:640px;width:100%}

/* header + search */
header.top{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 20px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.search{position:relative;margin-left:auto;width:min(320px,52%)}
.search input{width:100%;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--bg2);padding:0 16px 0 40px;font-size:16px}
.search input::placeholder{color:var(--muted)}
.search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.results{position:absolute;top:48px;left:0;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;z-index:40;max-height:60vh;overflow:auto}
.results button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left}
.results button[aria-selected="true"],.results button:hover{background:var(--soft)}
.results small{margin-left:auto;color:var(--muted);text-align:right;padding-left:8px}
.results .empty{padding:10px;color:var(--muted)}

/* flags */
.fl{width:28px;height:21px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;background:var(--soft)}
.fl.md{width:44px;height:33px;border-radius:5px}
.fl.lg{width:120px;height:90px;border-radius:8px}
.fl.xl{width:min(260px,70%);height:auto;aspect-ratio:4/3;border-radius:10px;box-shadow:0 0 0 1px rgba(0,0,0,.12),var(--shadow)}

/* map */
.mapbox{position:relative;flex:1;min-height:0;background:var(--ocean);overflow:hidden;touch-action:none}
svg.map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
svg.map.dragging{cursor:grabbing}
.sphere{fill:var(--ocean)}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.c{fill:var(--land);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke;transition:fill .3s}
svg.map:not(.quiz) .c:hover{fill:color-mix(in srgb,var(--land) 70%,var(--acc))}
.c.known{fill:var(--known)}
.c.hl,.c.hl:hover{fill:var(--acc)!important}
.c.ok{fill:var(--ok)!important}
.c.bad{fill:var(--bad)!important}
.pin .dotc{fill:var(--pin);stroke:var(--bg);vector-effect:non-scaling-stroke;stroke-width:2}
.pin.cap .dotc{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.pin.q .dotc{fill:var(--pin)}
.pin text{font-family:var(--display);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-linejoin:round}
.pin.choice{cursor:pointer}
.pin.choice .dotc{fill:var(--ink);stroke:var(--bg);stroke-width:2.5}
.pin.choice text{fill:var(--bg);stroke:none;font-weight:800;pointer-events:none}
.pin.choice.ok .dotc{fill:var(--ok)} .pin.choice.bad .dotc{fill:var(--bad)}
.pulse{fill:none;stroke:var(--pin);vector-effect:non-scaling-stroke;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out 3}
@keyframes pulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(3.4)}}
.mapui{position:absolute;inset:0;pointer-events:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.zoom button{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);display:grid;place-items:center;padding:0}
.caption{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 80px)}
.caption>div{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);padding:6px 14px 6px 8px;border-radius:20px;font-size:15px;font-weight:600;border:1px solid var(--line)}
.caption>div.plain{padding-left:14px}
.maphint{position:absolute;left:0;right:0;top:14px;text-align:center}
.maphint span{display:inline-block;background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:20px;font-size:15px;font-weight:600;box-shadow:var(--shadow)}
.legend{position:absolute;left:12px;top:12px;display:flex;gap:8px;align-items:center;font-size:14px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:4px 12px 4px 8px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--known);border:1px solid var(--border)}

/* country sheet */
.sheet{position:fixed;left:16px;bottom:16px;width:380px;max-height:calc(100vh - 110px);overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);z-index:30;padding:20px 20px 22px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}

/* country card */
.cc-top{display:flex;gap:16px;align-items:center;margin-bottom:14px;padding-right:36px}
.cc-top h3{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;margin:0 0 3px;letter-spacing:-.01em}
.cc-top p{margin:0;color:var(--muted);font-size:15px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 14px;font-size:15.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:500}
.facts dd b{font-family:var(--display);font-weight:600;font-size:17px}
.tipbox{display:flex;gap:10px;background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:15.5px}
.tipbox svg{flex:none;margin-top:3px;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:5px 12px 5px 6px;font-size:14.5px;font-weight:500}
.chip.plain{padding-left:12px}
.chip:hover{border-color:var(--ink)}
.chip .fl{width:22px;height:16px;border-radius:2px}
.lbl{font-size:14px;color:var(--muted);margin:12px 0 7px}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:3px;margin-top:14px}

/* type */
h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:600;font-size:16px;margin:34px 0 4px;letter-spacing:0}
.lead{color:var(--muted);margin:0 0 10px;font-size:15.5px;max-width:34em}
.muted{color:var(--muted)}
.small{font-size:15px;color:var(--muted)}

/* buttons */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:26px;border:0;background:var(--btn);color:var(--btn-ink);font-weight:600;transition:transform .12s}
.cta:active{transform:scale(.97)}
.cta.acc{background:var(--acc);color:var(--on)}
.cta.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cta.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:500;margin-bottom:12px}
.back:hover{color:var(--ink)}
kbd{font-family:var(--body);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}

/* home */
.hero{margin:8px 0 26px}
.hero h1{font-size:clamp(34px,4.2vw,50px);line-height:1.02}
.hero p{max-width:30em;margin:14px 0 0;font-size:18px}
.mystats{display:grid;grid-template-columns:1.4fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:26px}
.mystats>div{background:var(--bg2);padding:16px 18px}
.mystats .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.mystats .big small{font-size:16px;font-weight:600;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .5s}
.toc{list-style:none;margin:0;padding:0}
.toc li+li{border-top:1px solid var(--line)}
.toc button{display:grid;grid-template-columns:64px 1fr auto;gap:4px 14px;align-items:center;width:100%;background:none;border:0;padding:16px 4px;text-align:left}
.toc .n{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:var(--c)}
.toc .t{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2}
.toc .s{font-size:14.5px;color:var(--muted);display:flex;gap:12px;align-items:center}
.toc .s .meter{flex:1;max-width:120px;margin:0;height:5px}
.toc .s .meter i{background:var(--c)}
.toc .badge{grid-row:span 2;font-size:13px;font-weight:600;border-radius:12px;padding:3px 9px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);white-space:nowrap}
.toc button:hover .t{text-decoration:underline;text-underline-offset:4px}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--bg2);text-align:left}
.tile b{font-family:var(--display);font-weight:600;font-size:16px}
.tile span{font-size:14.5px;color:var(--muted)}
.tile:hover{border-color:var(--ink)}

/* lesson */
.lhead{display:flex;gap:16px;align-items:flex-end;margin-bottom:18px}
.lhead .n{font-family:var(--display);font-weight:800;font-size:76px;line-height:.8;color:var(--acc)}
.lhead .s{color:var(--muted);margin:6px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:16px;padding:4px;gap:4px;margin-bottom:22px;position:sticky;top:8px;z-index:4}
.seg button{border:0;background:none;border-radius:12px;padding:10px 6px;font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--bg2);box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.seg small{font-weight:500;color:var(--muted);font-size:13px}
.keys{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px 18px 6px;margin-bottom:8px}
.keys h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 8px;color:var(--acc)}
.keys ul{margin:0;padding:0;list-style:none}
.keys li{position:relative;padding-left:20px;margin-bottom:10px;font-size:15.5px}
.keys li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.studied{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--muted);margin:16px 0 0}
.studied .meter{flex:1;margin:0}
ul.items{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
ul.items>li{border-bottom:1px solid var(--line)}
.item{display:flex;width:100%;text-align:left;background:none;border:0;padding:11px 4px;gap:12px;align-items:center;min-height:50px}
.item .nm{font-weight:600}
.item .cap{color:var(--muted);margin-left:auto;text-align:right}
.item .tick{width:18px;height:18px;flex:none;color:var(--acc);opacity:0}
.item.done .tick{opacity:1}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;margin:0 9px}
.item .sw{width:28px;height:21px;border-radius:5px;flex:none;background:color-mix(in srgb,var(--acc) 30%,transparent);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink)}
.item[aria-expanded="true"]{color:var(--acc)}
.item[aria-expanded="true"] .cap{color:var(--acc)}
.detail{padding:4px 4px 18px}
.detail p{margin:0 0 10px;max-width:34em}

/* flashcards */
.deckbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:15px;color:var(--muted)}
.dirs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.dirs button{border:1px solid var(--line);background:none;border-radius:16px;padding:6px 12px;font-size:14.5px;font-weight:500}
.dirs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fcwrap{perspective:1400px;margin-bottom:14px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;background:none;width:100%;padding:0}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--bg2);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--acc);color:var(--on);border-color:transparent}
.face .big{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,32px);line-height:1.1;letter-spacing:-.015em}
.face .q{font-size:15px;opacity:.75}
.face .d{font-size:15.5px;max-width:30em;line-height:1.45}
.face .turn{position:absolute;bottom:14px;font-size:13px;opacity:.6}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcbtns .cta{width:100%}
.stack{display:flex;gap:3px;margin-bottom:16px}
.stack i{flex:1;height:5px;border-radius:3px;background:var(--soft)}
.stack i.k{background:var(--acc)}

/* quiz */
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:15px;margin-bottom:8px}
.dots{display:flex;gap:4px;margin-bottom:22px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--soft)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.cur{background:var(--ink)}
.q:focus{outline:none}
.q{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-weight:500;min-height:52px;transition:transform .12s}
.opt kbd{margin-left:auto}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.ok{background:var(--ok);color:var(--on);border-color:var(--ok)}
.opt.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.ok kbd,.opt.bad kbd{color:inherit;border-color:currentColor}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.flaggrid{grid-template-columns:1fr 1fr}
.flaggrid .opt{flex-direction:column;padding:10px;gap:8px}
.flaggrid .opt img{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.flaggrid .opt span{font-size:14px;min-height:1.4em}
.letters{grid-template-columns:repeat(4,1fr)}
.letters .opt{justify-content:center;font-family:var(--display);font-weight:800;font-size:20px}
.qflag{display:flex;justify-content:center;margin:0 0 20px}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,var(--ok) 16%,transparent);animation:rise .25s ease-out}
.fb.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.fb b{display:block;margin-bottom:2px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ring{display:block;margin:6px 0 8px}
.ring text{font-family:var(--display);font-weight:800;fill:var(--ink)}
.review{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.review li{border-bottom:1px solid var(--line);padding:10px 2px;display:flex;gap:12px;align-items:center;font-size:15.5px}
.review li span{color:var(--muted)}
.opts-setup{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.opts-setup button{border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:9px 16px;font-weight:500}
.opts-setup button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;color:var(--ink)}
.streak.hot{color:var(--pin)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;z-index:60;box-shadow:var(--shadow);animation:rise .25s}
.empty-state{border:1.5px dashed var(--line);border-radius:20px;padding:24px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .app{display:block}
  .mapcol{height:44vh;height:44svh;z-index:10;border-right:0;border-bottom:1px solid var(--line)}
  header.top{padding:8px 10px 8px 14px;gap:10px}
  .brand b{font-size:15px}
  .search{width:auto;flex:1}

const flagSrc=k=>{const c=C[k];return c&&c.f&&FLAGS[c.f]};
const flagImg=(k,cls='fl',alt)=>{const s=flagSrc(k);return s?`<img class="${cls}" src="${s}" alt="${esc(alt??('Флаг: '+C[k].n))}" loading="lazy">`:`<span class="${cls}" aria-hidden="true"></span>`};

/* ---------------- state ---------------- */

let saveT=null;

function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{const v=JSON.stringify(S);try{if(hasWS())await window.storage.set(SKEY,v,false);else localStorage.setItem(SKEY,v)}catch(e){}},300)}
async function load(){try{let v=null;if(hasWS()){const r=await window.storage.get(SKEY);v=r&&r.value}else v=localStorage.getItem(SKEY);if(v)S={...S,...JSON.parse(v)}}catch(e){}}

/* ---------------- map ---------------- */
el('path',{d:DATA.sphere,class:'sphere'},svg);
el('path',{d:DATA.grat,class:'grat'},svg);
const gC=el('g',{},svg), gP=el('g',{},svg);
DATA.countries.forEach(c=>{const p=el('path',{d:c.d,class:'c'},gC);p.dataset.k=c.k;c.el=p});
let vb={x:0,y:0,w:W,h:H};
const aspect=()=>{const r=svg.getBoundingClientRect();return r.width/Math.max(r.height,1)};
const ppu=()=>svg.getBoundingClientRect().width/vb.w;
function setVB(v){vb=v;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);sizePins()}
function clampVB(v){const a=aspect();let w=Math.min(Math.max(v.w,14),W*1.2);let h=w/a;let x=v.x,y=v.y;
  x=w<W?Math.min(Math.max(x,0),W-w):(W-w)/2;y=h<H?Math.min(Math.max(y,0),H-h):(H-h)/2;return {x,y,w,h}}
let anim=null;
function animateTo(t){t=clampVB(t);cancelAnimationFrame(anim);if(reduce){setVB(t);return}
  const s={...vb},t0=performance.now(),D=700;
  const step=n=>{let k=Math.min((n-t0)/D,1);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    setVB({x:s.x+(t.x-s.x)*k,y:s.y+(t.y-s.y)*k,w:s.w+(t.w-s.w)*k,h:s.h+(t.h-s.h)*k});if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step)}
function fitBox(b,pad=.25,minW=110,instant=false){let [[x0,y0],[x1,y1]]=b;let w=x1-x0,h=y1-y0;const cx=(x0+x1)/2,cy=(y0+y1)/2;
  w=Math.max(w*(1+pad*2),minW);h=Math.max(h*(1+pad*2),minW/2.2);const a=aspect();if(w/h<a)w=h*a;else h=w/a;
  const t={x:cx-w/2,y:cy-h/2,w,h};instant?setVB(clampVB(t)):animateTo(t)}
const world=(i)=>fitBox([[0,0],[W,H]],0,110,i);
const ubox=bs=>bs.reduce((a,b)=>[[Math.min(a[0][0],b[0][0]),Math.min(a[0][1],b[0][1])],[Math.max(a[1][0],b[1][0]),Math.max(a[1][1],b[1][1])]],[[1e9,1e9],[-1e9,-1e9]]);
const ptBox=p=>[[p[0],p[1]],[p[0],p[1]]];
function zoomBy(f){const cx=vb.x+vb.w/2,cy=vb.y+vb.h/2;animateTo({x:cx-vb.w*f/2,y:cy-vb.h*f/2,w:vb.w*f,h:vb.h*f})}
$('#zin').onclick=()=>zoomBy(.6);$('#zout').onclick=()=>zoomBy(1.6);$('#zreset').onclick=()=>world();

function sizePins(){const k=1/ppu();
  gP.querySelectorAll('.pin').forEach(p=>{const ch=p.classList.contains('choice');
    p.querySelector('.dotc').setAttribute('r',(ch?14:p.classList.contains('cap')?5.5:7)*k);
    const t=p.querySelector('text');if(t){t.setAttribute('font-size',(ch?14:13)*k);t.setAttribute('stroke-width',4*k);t.setAttribute('dy',(ch?5:4.5)*k);if(!ch)t.setAttribute('dx',11*k)}
    const r=p.querySelector('.pulse');if(r)r.setAttribute('r',7*k)})}
function addPin(xy,label,cls=''){const g=el('g',{class:'pin '+cls,transform:`translate(${xy[0]} ${xy[1]})`},gP);
  if(!cls.includes('choice')&&!reduce)el('circle',{class:'pulse',cx:0,cy:0,r:7},g);
  el('circle',{class:'dotc',cx:0,cy:0,r:6},g);
  if(label!=null){const t=el('text',{'text-anchor':cls.includes('choice')?'middle':'start'},g);t.textContent=label}
  sizePins();return g}
let showKnown=false;
function clearMap(){gP.innerHTML='';DATA.countries.forEach(c=>c.el.setAttribute('class','c'+(showKnown&&S.known[c.k]?' known':'')));caption('')}
function setKnownLayer(on){showKnown=on;$('#legend').hidden=!on||!Object.keys(S.known).length;DATA.countries.forEach(c=>c.el.classList.toggle('known',on&&!!S.known[c.k]))}
function caption(html,plain){const c=$('#caption');c.innerHTML=html?`<div class="${plain?'plain':''}">${html}</div>`:''}
function capCountry(k){const c=C[k];caption(`${flagImg(k,'fl','')}<span>${esc(c.n)}${c.cap?`, ${esc(c.cap)}`:''}</span>`)}
function hint(t){const h=$('#maphint');h.hidden=!t;h.querySelector('span').textContent=t||''}
function highlight(keys,cls='hl'){keys.forEach(k=>C[k]&&C[k].el.classList.add(cls))}

/* pointer: pan, pinch, tap, hover */
const ptrs=new Map();let drag=null,moved=0,pinch=null,tapHandler=null,quizMap=false;
const toMap=(cx,cy)=>{const r=svg.getBoundingClientRect();return [vb.x+(cx-r.left)/r.width*vb.w,vb.y+(cy-r.top)/r.height*vb.h]};
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cancelAnimationFrame(anim);
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,vb:{...vb}};moved=0}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb},c:toMap((a.x+b.x)/2,(a.y+b.y)/2)};moved=99}});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){if(e.pointerType==='mouse'&&!quizMap){const t=e.target;if(t.classList&&t.classList.contains('c'))capCountry(t.dataset.k)}return}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const f=pinch.d/Math.max(Math.hypot(a.x-b.x,a.y-b.y),1);const v=pinch.vb,c=pinch.c;
    setVB(clampVB({x:c[0]-(c[0]-v.x)*f,y:c[1]-(c[1]-v.y)*f,w:v.w*f,h:v.h*f}));return}
  if(drag){const r=svg.getBoundingClientRect();const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));
    if(moved>6){svg.classList.add('dragging');const s=drag.vb.w/r.width;setVB(clampVB({...drag.vb,x:drag.vb.x-dx*s,y:drag.vb.y-dy*s}))}}});
function endPtr(e){const tap=ptrs.size===1&&moved<=6;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){svg.classList.remove('dragging');drag=null;
    if(tap&&e.type==='pointerup'){const t=document.elementFromPoint(e.clientX,e.clientY);if(!t)return;
      const ch=t.closest&&t.closest('.pin.choice');if(ch){ch.dispatchEvent(new Event('pick'));return}
      if(t.classList.contains('c')){const k=t.dataset.k;if(tapHandler)tapHandler(k);else openCountry(k)}}}
  else{const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vb:{...vb}}}}
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!quizMap&&!sheetOpen())caption('')});
svg.addEventListener('wheel',e=>{e.preventDefault();const c=toMap(e.clientX,e.clientY);const f=Math.exp(e.deltaY*.0015);
  setVB(clampVB({x:c[0]-(c[0]-vb.x)*f,y:c[1]-(c[1]-vb.y)*f,w:vb.w*f,h:vb.h*f}))},{passive:false});
addEventListener('resize',()=>setVB(clampVB(vb)));

/* ---------------- country card ---------------- */
function countryCard(k,{inline=false}={}){const c=C[k];if(!c)return '';
  const facts=[];
  if(c.cap)facts.push(['Столица',`<b>${esc(c.cap)}</b>`]);
  if(c.area)facts.push(['Площадь',`${fmt(c.area)} км²${c.rank?`, ${c.rank}-е место в мире`:''}`]);
  if(c.langs&&c.langs.length)facts.push([c.langs.length>1?'Языки':'Язык',esc(c.langs.join(', '))]);
  if(c.land!=null&&c.k!=='Antarctica')facts.push(['Море',c.land?'нет выхода к морю':'есть выход к морю']);
  let h='';
  if(!inline)h+=`<div class="cc-top">${flagImg(k,'fl lg')}<div><h3>${esc(c.n)}</h3><p>${esc([c.sub,c.cont&&c.sub&&!c.sub.includes(c.cont)?c.cont:''].filter(Boolean).join(', '))}</p></div></div>`;
  else h+=`<div class="cc-top" style="padding-right:0">${flagImg(k,'fl lg')}<div><p>${esc(c.sub||'')}</p></div></div>`;
  if(facts.length)h+=`<dl class="facts">${facts.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`;
  if(c.tip)h+=`<div class="tipbox">${ICON.bulb}<span>${esc(c.tip)}</span></div>`;
  if(c.nb&&c.nb.length)h+=`<div class="lbl">${c.nb.length} ${plural(c.nb.length,'сосед','соседа','соседей')} по суше</div><div class="chips">${c.nb.map(n=>`<button class="chip" data-country="${esc(n)}">${flagImg(n,'fl','')}${esc(C[n].n)}</button>`).join('')}</div>`;
  else if(c.land===false&&c.k!=='Antarctica')h+=`<div class="lbl">Сухопутных соседей нет</div>`;
  if(!inline&&c.les&&current.view!=='lesson')h+=`<button class="linkbtn" data-lesson="${c.les}">Открыть урок ${c.les}: ${esc(LESSON(c.les).title)}</button>`;
  return h}
const sheet=$('#sheet');
const sheetOpen=()=>!sheet.hidden;
function openCountry(k,{fly=true}={}){if(!C[k])return;const c=C[k];
  clearMap();highlight([k]);if(c.cxy)addPin(c.cxy,c.cap,'cap');if(fly)fitBox(c.b,.45,isMobile()?70:90);capCountry(k);
  sheet.innerHTML=`<button class="x" id="sheetx" aria-label="Закрыть карточку">${ICON.x}</button>${countryCard(k)}`;sheet.hidden=false;sheet.scrollTop=0;
  $('#sheetx').onclick=closeSheet;markKnown(k)}
function closeSheet(){sheet.hidden=true;if(current.view==='home'){clearMap();setKnownLayer(true)}}

/* ---------------- search ---------------- */
const qIn=$('#q'),res=$('#results');let resIdx=0,resList=[];
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
function runSearch(){const v=norm(qIn.value);if(!v){res.hidden=true;qIn.setAttribute('aria-expanded','false');return}
  const sc=c=>{const n=norm(c.n),cp=norm(c.cap||'');if(n.startsWith(v))return 0;if(cp.startsWith(v))return 1;if(n.includes(v))return 2;if(cp.includes(v))return 3;return 9};
  resList=DATA.countries.filter(c=>c.n&&sc(c)<9).sort((a,b)=>sc(a)-sc(b)||a.n.localeCompare(b.n,'ru')).slice(0,8);resIdx=0;
  res.innerHTML=resList.length?resList.map((c,i)=>`<button role="option" aria-selected="${i===0}" data-k="${esc(c.k)}">${flagImg(c.k,'fl','')}<span>${esc(c.n)}</span><small>${esc(c.cap||'')}</small></button>`).join(''):`<div class="empty">Ничего не нашлось. Попробуйте название страны или столицы по-русски.</div>`;
  res.hidden=false;qIn.setAttribute('aria-expanded','true')}
function choose(k){res.hidden=true;qIn.value='';qIn.blur();qIn.setAttribute('aria-expanded','false');openCountry(k)}
qIn.addEventListener('input',runSearch);
qIn.addEventListener('keydown',e=>{if(res.hidden)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();resIdx=(resIdx+(e.key==='ArrowDown'?1:-1)+resList.length)%resList.length;res.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-selected',i===resIdx))}
  if(e.key==='Enter'&&resList[resIdx]){e.preventDefault();choose(resList[resIdx].k)}
  if(e.key==='Escape'){res.hidden=true}});
res.addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b)choose(b.dataset.k)});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});
/* ---------------- question factory ---------------- */
const POOL_ALL=DATA.countries.filter(c=>c.cap&&c.f&&c.cont&&c.n);
const POOL_LES=POOL_ALL.filter(c=>c.les);
function distractors(k,n=3,need='cap',pool=POOL_ALL){const c=C[k];const same=shuffle(pool.filter(x=>x.k!==k&&x.cont===c.cont&&x[need]!==c[need]));
  const rest=shuffle(pool.filter(x=>x.k!==k&&x.cont!==c.cont));return same.concat(rest).slice(0,n)}
function makeC(k,type){const c=C[k];let q;
  if(type==='cap'){const o=shuffle([c,...distractors(k)]);q={t:'mc',q:`Столица страны «${c.n}»?`,o:o.map(x=>x.cap),a:o.indexOf(c),e:c.tip||`${c.n}: столица — ${c.cap}.`,flagOf:null}}
  else if(type==='capr'){const o=shuffle([c,...distractors(k,3,'n')]);q={t:'mc',q:`${c.cap} — столица какой страны?`,o:o.map(x=>x.n),a:o.indexOf(c),e:c.tip||`${c.cap} — столица страны «${c.n}».`}}
  else if(type==='flag'){const o=shuffle([c,...distractors(k,3,'f')]);q={t:'mc',q:'Чей это флаг?',show:k,o:o.map(x=>x.n),a:o.indexOf(c),e:`${c.n}, столица — ${c.cap}.`}}
  else if(type==='flagpick'){const o=shuffle([c,...distractors(k,3,'f')]);q={t:'flagpick',q:`Где флаг страны «${c.n}»?`,ks:o.map(x=>x.k),a:o.indexOf(c),e:`${c.n}, столица — ${c.cap}.`}}
  else q={t:'country',q:`Найдите на карте: ${c.n}`,target:k,e:`${c.n}${c.sub?', '+c.sub:''}. Столица — ${c.cap}.`};
  q.target=q.target||k;q.spec={k,type};q.key=`c|${k}|${type}`;return q}
function makeL(L,i){const src=LESSON(L).quiz[i];let q;
  if(src.t==='flag'||src.t==='flagpick'){q=makeC(src.target,src.t);if(src.e)q.e=src.e}
  else if(src.t==='mc'){const ord=shuffle(src.o.map((_,j)=>j));q={...src,o:ord.map(j=>src.o[j]),a:ord.indexOf(src.a)}}
  else q={...src};
  q.spec={L,i};q.key=`q|${L}|${i}`;return q}
const fromSpec=s=>s.L!=null?makeL(s.L,s.i):makeC(s.k,s.type);
function trainGen(cfg){const pool=(cfg.scope==='all'?POOL_ALL:POOL_LES).filter(c=>cfg.region==='all'||c.cont===cfg.region);
  const types={cap:['cap','capr'],flag:['flag','flagpick'],map:['map'],mix:['cap','capr','flag','flagpick','map']}[cfg.mode];
  let last=null;return ()=>{let c,t,tries=0;do{c=pick(pool);t=pick(types);tries++}while(tries<20&&(c.k===last||(t==='map'&&(c.b[1][0]-c.b[0][0])<1.5)));last=c.k;return makeC(c.k,t)}}

/* ---------------- router ---------------- */
let current={view:'home'};
const view=$('#view');
function go(v){current=v;document.body.dataset.acc=v.lesson||(v.view==='trainer'?1:v.view==='mistakes'?4:2);
  sheet.hidden=true;tapHandler=null;quizMap=false;svg.classList.remove('quiz');hint('');
  setKnownLayer(v.view==='home');clearMap();if(v.view!=='lesson'||v.tab!=='learn')world();
  if(v.view==='lesson'){S.last={lesson:v.lesson,tab:v.tab};save()}
  ({home:renderHome,lesson:renderLesson,trainer:renderTrainer,mistakes:renderMistakes})[v.view]();
  const top=isMobile()?0:0;if(scrollY>top)scrollTo({top,behavior:'auto'});view.focus?.()}
$('#brand').onclick=()=>go({view:'home'});
document.addEventListener('click',e=>{const t=e.target.closest('[data-country],[data-lesson],[data-go]');if(!t)return;
  if(t.dataset.country){e.preventDefault();openCountry(t.dataset.country)}
  else if(t.dataset.lesson){go({view:'lesson',lesson:+t.dataset.lesson,tab:t.dataset.tab||'learn'})}
  else if(t.dataset.go){go({view:t.dataset.go})}});

  <div class="mystats">

  </div>`}

function renderLesson(){const L=current.lesson,l=LESSON(L),tab=current.tab;const t=S.tests[L];
  view.innerHTML=`<button class="back" data-go="home">${ICON.back}Все уроки</button>

  view.querySelectorAll('[data-tab2]').forEach(b=>b.onclick=()=>go({view:'lesson',lesson:L,tab:b.dataset.tab2}));

function renderLearn(l){const L=l.id,n=itemsOf(L),s=studiedOf(L);const tb=$('#tabbody');
  let h=`<p style="margin:0 0 18px;max-width:34em">${esc(l.intro)}</p><div class="keys"><h3>Главное</h3><ul>${l.keys.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div>
  <div class="studied"><span id="stc">Изучено ${s} из ${n}</span><span class="meter"><i id="stm" style="width:${s/n*100}%"></i></span></div>`;
  l.groups.forEach((g,gi)=>{h+=`<h2>${esc(g.title)}</h2>${g.lead?`<p class="lead">${esc(g.lead)}</p>`:''}<ul class="items">`;
    g.items.forEach((it,ii)=>{const key=`${L}:${gi}:${ii}`;const done=S.studied[key]?' done':'';

let deck=null;
function renderCards(l){const hasC=l.groups.some(g=>g.kind==='country');
  const dirs=hasC?['Страна → столица','Столица → страна','Флаг → страна']:['Название → место','Место → название'];
  const dir=Math.min(current.dir||0,dirs.length-1);
  const items=[];l.groups.forEach(g=>g.items.forEach(it=>{if(hasC&&g.kind!=='country')return;items.push({kind:g.kind,it})}));

function drawCard(){const d=deck,tb=$('#tabbody');clearMap();

  if(!d.queue.length){tb.innerHTML=dirsH+`<div class="empty-state"><div class="big" style="font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);margin-bottom:6px">Колода пройдена</div>Все ${d.all.length} карточек — в копилке. Теперь проверьте себя в тесте.</div>
    <div class="row" style="margin-top:18px"><button class="cta acc" data-lesson="${d.l.id}" data-tab="test">Пройти тест</button><button class="cta ghost" id="again">Ещё раз</button></div>`;
    $('#again').onclick=()=>renderCards(d.l);bindDirs();return}

   <div class="stack" aria-hidden="true">${Array.from({length:tot},(_,i)=>`<i class="${i<d.known?'k':''}"></i>`).join('')}</div>
   <div class="fcwrap"><button class="fc" id="fc" aria-label="Перевернуть карточку"><div class="face">${front}<span class="turn">Нажмите, чтобы перевернуть <kbd>Пробел</kbd></span></div><div class="face back" aria-hidden="true">${back}</div></button></div>
   <div class="fcbtns"><button class="cta ghost" id="again1">Ещё повторю</button><button class="cta acc" id="know">Помню</button></div>`;
  d.flipped=false;
  if((kind==='point'||kind==='set')&&d.dir===1)showItem(kind,it,{label:false});

function bindDirs(){$$('[data-dir]').forEach(b=>b.onclick=()=>{current.dir=+b.dataset.dir;renderCards(deck.l)})}
function cardFaces(kind,it,dir){
  if(kind==='country'){const c=C[it.c];
    if(dir===0)return[`${flagImg(it.c,'fl md','')}<div class="big">${esc(c.n)}</div><div class="q">Столица?</div>`,`<div class="q">Столица</div><div class="big">${esc(c.cap)}</div>${c.tip?`<div class="d">${esc(c.tip)}</div>`:''}`];
    if(dir===1)return[`<div class="big">${esc(c.cap)}</div><div class="q">Столица какой страны?</div>`,`${flagImg(it.c,'fl md','')}<div class="big">${esc(c.n)}</div>${c.tip?`<div class="d">${esc(c.tip)}</div>`:''}`];
    return[`${flagImg(it.c,'fl xl','Флаг')}<div class="q">Чей это флаг?</div>`,`<div class="big">${esc(c.n)}</div><div class="d">Столица — ${esc(c.cap)}</div>`]}
  if(dir===0)return[`<div class="big">${esc(it.n)}</div><div class="q">${kind==='set'?'Какие страны сюда входят?':'Где это на карте?'}</div>`,`<div class="big">${esc(it.n)}</div><div class="d">${esc(it.d)}</div>`];
  return[`<div class="big" style="font-size:22px">${kind==='set'?'Что подсвечено на карте?':'Что отмечено на карте?'}</div><div class="q">Вспомните и переверните</div>`,`<div class="big">${esc(it.n)}</div><div class="d">${esc(it.d)}</div>`]}
function flip(){const d=deck;if(!d||!d.queue.length)return;const fc=$('#fc');d.flipped=!d.flipped;fc.classList.toggle('flip',d.flipped);

/* ---------------- quiz ---------------- */
let Q=null;
function renderTestIntro(l){const tb=$('#tabbody');const n=l.quiz.length;const t=S.tests[l.id];
  const kinds=[...new Set(l.quiz.map(q=>({mc:'вопросы с вариантами',pins:'метки на карте',country:'поиск страны на карте',flag:'флаги',flagpick:'флаги'}[q.t])))];
  tb.innerHTML=`<div class="keys"><h3>${n} ${plural(n,'вопрос','вопроса','вопросов')}</h3><ul><li>В тесте: ${kinds.join(', ')}.</li><li>Отвечать можно клавишами <kbd>1</kbd>–<kbd>4</kbd>, дальше — <kbd>Enter</kbd>.</li><li>Ошибки попадут в «Работу над ошибками».</li></ul></div>
   ${t?`<p class="small" style="margin-top:14px">Лучший результат: ${t.best} из ${t.total}</p>`:''}
   <button class="cta acc" id="go" style="margin-top:18px">${t?'Пройти ещё раз':'Начать тест'}</button>`;
  $('#go').onclick=()=>startQuiz({mode:'lesson',L:l.id,title:`Тест: ${l.title}`,list:l.quiz.map((_,i)=>makeL(l.id,i)),host:'#tabbody'})}
function startQuiz(o){Q={...o,i:0,res:[],answered:false,streak:0,best:S.trainBest||0};renderQ()}
function host(){return $(Q.host||'#view')}
function renderQ(){clearMap();hint('');tapHandler=null;quizMap=false;svg.classList.add('quiz');sheet.hidden=true;Q.answered=false;
  const q=Q.list[Q.i];const n=Q.list.length;const h=host();
  let top;
  if(Q.endless)top=`<div class="qmeta"><span>${esc(Q.title)}</span><span class="streak${Q.streak>=5?' hot':''}">${Q.streak>=3?ICON.fire:''}Серия ${Q.streak}<span class="small" style="font-family:var(--body);font-weight:400;margin-left:6px">рекорд ${Q.best}</span></span></div>`;
  else top=`<div class="qmeta"><span>${esc(Q.title)}</span><span>${Q.i+1} из ${n}</span></div><div class="dots" aria-hidden="true">${Q.list.map((_,i)=>`<i class="${i<Q.res.length?(Q.res[i]?'ok':'bad'):i===Q.i?'cur':''}"></i>`).join('')}</div>`;
  let body=`<p class="q" tabindex="-1" id="qtext">${esc(q.q)}</p>`;
  if(q.show)body+=`<div class="qflag">${flagImg(q.show,'fl xl','Флаг для угадывания')}</div>`;
  if(q.t==='mc')body+=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}<kbd>${i+1}</kbd></button>`).join('')}</div>`;
  if(q.t==='flagpick')body+=`<div class="opts flaggrid">${q.ks.map((k,i)=>`<button class="opt" data-i="${i}" aria-label="Вариант ${i+1}">${flagImg(k,'','')}<span></span></button>`).join('')}</div>`;
  if(q.t==='pins')body+=`<p class="small" style="margin-top:-8px">Нажмите на метку на карте или на букву.</p><div class="opts letters">${LET.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  if(q.t==='country')body+=`<p class="small" style="margin-top:-8px">Нажмите на страну. Карту можно двигать и приближать.</p><button class="opt" id="giveup" style="width:auto">Показать ответ</button>`;
  h.innerHTML=top+body+`<div id="fb" aria-live="polite"></div>`+(Q.endless?`<button class="back" id="stop" style="margin-top:20px">Закончить тренировку</button>`:'');
  if(Q.endless)$('#stop').onclick=finishQuiz;
  const opts=[...h.querySelectorAll('.opt[data-i]')];
  const choose=i=>{if(Q.answered)return;const ok=i===q.a;opts.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
    if(q.t==='flagpick')opts.forEach((b,j)=>b.querySelector('span').textContent=C[q.ks[j]].n);
    if(q.t==='pins'){pins.forEach((p,j)=>{if(j===q.a)p.classList.add('ok');else if(j===i)p.classList.add('bad')})}
    if(q.t==='mc'||q.t==='flagpick'){if(C[q.target]&&(q.spec&&q.spec.k)){highlight([q.target],'ok');const c=C[q.target];if(c.cxy)addPin(c.cxy,c.cap,'cap');fitBox(c.b,.6,isMobile()?90:120)}}
    answer(ok)};
  opts.forEach(b=>b.onclick=()=>choose(+b.dataset.i));Q.choose=choose;
  let pins=[];
  if(q.t==='mc'||q.t==='flagpick')world();
  if(q.t==='pins'){pins=q.xy.map((xy,i)=>{const p=addPin(xy,LET[i],'choice');p.addEventListener('pick',()=>choose(i));return p});quizMap=true;fitBox(ubox(q.xy.map(ptBox)),.25,200)}
  if(q.t==='country'){quizMap=true;const t=C[q.target];const [[x0,y0],[x1,y1]]=t.b;const cx=(x0+x1)/2,cy=(y0+y1)/2;const sz=Math.max(x1-x0,y1-y0);
    const span=Math.max(sz*2.6,isMobile()?150:130);const ox=(Math.random()-.5)*span*.35,oy=(Math.random()-.5)*span*.2;
    fitBox([[cx-span/2+ox,cy-span/3+oy],[cx+span/2+ox,cy+span/3+oy]],0,100);hint(`Где ${t.n}?`);
    const fin=k=>{if(Q.answered)return;tapHandler=null;hint('');highlight([q.target],'ok');if(t.cxy)addPin(t.cxy,t.cap,'cap');
      if(k&&k!==q.target){highlight([k],'bad');caption(`Вы выбрали: ${esc(C[k].n)}`,true)}else capCountry(q.target);
      $('#giveup').disabled=true;fitBox(ubox([t.b].concat(k&&C[k]?[C[k].b]:[])),.3,100);answer(k===q.target)};
    tapHandler=fin;$('#giveup').onclick=()=>fin(null);Q.choose=null}
  if(!isMobile())$('#qtext').focus({preventScroll:true})}
function answer(ok){Q.answered=true;const q=Q.list[Q.i];Q.res.push(ok);
  if(!ok){buzz();const f=$('#qtext');f.classList.add('shake');setTimeout(()=>f.classList.remove('shake'),400)}
  if(ok&&q.target&&C[q.target])markKnown(q.target);
  if(!ok)S.mistakes[q.key]={spec:q.spec,n:((S.mistakes[q.key]||{}).n||0)+1};else if(Q.mode==='review'||S.mistakes[q.key])delete S.mistakes[q.key];
  if(Q.endless){Q.streak=ok?Q.streak+1:0;if(Q.streak>Q.best){Q.best=Q.streak;S.trainBest=Q.best}
    const st=host().querySelector('.streak');if(st)st.outerHTML=`<span class="streak${Q.streak>=5?' hot':''}">${Q.streak>=3?ICON.fire:''}Серия ${Q.streak}<span class="small" style="font-family:var(--body);font-weight:400;margin-left:6px">рекорд ${Q.best}</span></span>`}
  save();
  const last=!Q.endless&&Q.i===Q.list.length-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'':'bad'}"><b>${ok?pick(['Верно','Точно','Да!','Отлично']):'Не совсем'}</b>${esc(q.e||'')}</div><button class="cta wide" id="next" style="margin-top:12px">${last?'Посмотреть результат':'Дальше'} <kbd style="color:inherit;border-color:currentColor;opacity:.6">Enter</kbd></button>`;

function next(){if(!Q||!Q.answered)return;if(Q.endless){Q.list.push(Q.gen());Q.i++;renderQ();return}
  if(Q.i===Q.list.length-1)finishQuiz();else{Q.i++;renderQ()}}
function ring(score,total){const r=52,c=2*Math.PI*r,p=total?score/total:0;
  return `<svg class="ring" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="${score} из ${total}"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/>${p>0?`<circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 70 70)"/>`:""}<text x="70" y="78" text-anchor="middle" font-size="28">${score}/${total}</text></svg>`}
function finishQuiz(){svg.classList.remove('quiz');tapHandler=null;quizMap=false;hint('');clearMap();world();
  const answered=Q.res.length,score=Q.res.filter(Boolean).length;
  if(Q.mode==='lesson'){const p=S.tests[Q.L];S.tests[Q.L]={best:Math.max(p?p.best:0,score),total:Q.list.length}}
  save();
  const pct=answered?score/answered:0;
  const msg=Q.endless?(answered?`Лучшая серия за всё время: ${S.trainBest}.`:'Начните, когда будете готовы.'):pct===1?'Без единой ошибки — материал усвоен.':pct>=.7?'Хороший результат. Вернитесь к ошибкам завтра: на следующий день они запоминаются крепче.':'Полистайте карточки и попробуйте снова — со второго раза запоминается заметно лучше.';
  const wrong=Q.list.slice(0,answered).map((q,i)=>[q,Q.res[i]]).filter(x=>!x[1]).map(x=>x[0]);
  const ansText=q=>q.t==='mc'?q.o[q.a]:q.t==='pins'?`метка ${LET[q.a]}`:C[q.target]?C[q.target].n:'';
  const nextL=Q.mode==='lesson'&&LESSON(Q.L+1);
  host().innerHTML=`<div class="qmeta"><span>${esc(Q.title)}</span></div>${ring(score,answered)}<p style="max-width:32em">${msg}</p>
   ${wrong.length?`<div class="lbl">Что повторить</div><ul class="review">${wrong.map(q=>`<li>${q.target&&C[q.target]&&q.spec&&q.spec.k?flagImg(q.target,'fl',''):''}<div>${esc(q.q)}<br><span>Ответ: ${esc(ansText(q))}</span></div></li>`).join('')}</ul>`:''}
   <div class="row" style="margin-top:22px">${Q.mode==='lesson'?`<button class="cta acc" id="again">Пройти ещё раз</button>${nextL?`<button class="cta ghost" data-lesson="${nextL.id}">Урок ${nextL.id}</button>`:`<button class="cta ghost" data-go="trainer">В тренажёр</button>`}`:Q.mode==='review'?`<button class="cta acc" data-go="mistakes">К списку ошибок</button>`:`<button class="cta acc" id="again">Ещё тренировка</button>`}<button class="cta ghost" data-go="home">Все уроки</button></div>`;

document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;

  if(Q&&document.getElementById('qtext')){if(!Q.answered&&Q.choose&&/^[1-4]$/.test(e.key)){Q.choose(+e.key-1);e.preventDefault();return}
    if(Q.answered&&e.key==='Enter'&&document.activeElement.id!=='next'){next();e.preventDefault();return}}
  if(deck&&document.getElementById('fc')){if(e.key===' '&&!e.target.matches('button')){flip();e.preventDefault()}
    if(e.key==='ArrowRight')cardDone(true);if(e.key==='ArrowLeft')cardDone(false)}});

/* ---------------- init ---------------- */
requestAnimationFrame(async()=>{world(true);await load();go({view:'home'})});
</script>
<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
